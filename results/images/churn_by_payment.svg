<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" font-family="Helvetica,Arial,sans-serif"><rect width="640" height="220" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Churn rate by payment method (%)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">electronic check is the highest-churn method; automatic payment roughly halves churn</text><rect x="175" y="57.3" width="298.2" height="24.8" fill="#e07a5f"/><text x="169" y="74" font-size="10" text-anchor="end" fill="#333">Electronic check</text><text x="477" y="74" font-size="9" text-anchor="start" fill="#444">45.3%  n=2,365, $84.3k MRR lost</text><rect x="175" y="92.8" width="125.8" height="24.8" fill="#1f6f8b"/><text x="169" y="109" font-size="10" text-anchor="end" fill="#333">Mailed check</text><text x="305" y="109" font-size="9" text-anchor="start" fill="#444">19.1%  n=1,612, $16.8k MRR lost</text><rect x="175" y="128.3" width="110.0" height="24.8" fill="#1f6f8b"/><text x="169" y="145" font-size="10" text-anchor="end" fill="#333">Bank transfer (automatic)</text><text x="289" y="145" font-size="9" text-anchor="start" fill="#444">16.7%  n=1,544, $20.1k MRR lost</text><rect x="175" y="163.8" width="100.3" height="24.8" fill="#1f6f8b"/><text x="169" y="180" font-size="10" text-anchor="end" fill="#333">Credit card (automatic)</text><text x="279" y="180" font-size="9" text-anchor="start" fill="#444">15.2%  n=1,522, $17.9k MRR lost</text><line x1="175.0" y1="52" x2="175.0" y2="194" stroke="#999"/></svg>
