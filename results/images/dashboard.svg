77">$139.1k of $456.1k MRR left with churners ($1.67M a year)</text><rect x="194" y="55.6" width="315.2" height="17.0" fill="#e07a5f"/><text x="188" y="68" font-size="10" text-anchor="end" fill="#333">Month-to-month / Fiber optic</text><text x="513" y="68" font-size="9" text-anchor="start" fill="#444">$100.5k  churn 54.6%, n=2,128</text><rect x="194" y="79.9" width="57.6" height="17.0" fill="#e07a5f"/><text x="188" y="92" font-size="10" text-anchor="end" fill="#333">Month-to-month / DSL</text><text x="255" y="92" font-size="9" text-anchor="start" fill="#444">$18.4k  churn 32.2%, n=1,223</text><rect x="194" y="104.1" width="33.2" height="17.0" fill="#1f6f8b"/><text x="188" y="117" font-size="10" text-anchor="end" fill="#333">One year / Fiber optic</text><text x="231" y="117" font-size="9" text-anchor="start" fill="#444">$10.6k  churn 19.3%, n=539</text><rect x="194" y="128.3" width="10.5" height="17.0" fill="#1f6f8b"/><text x="188" y="141" font-size="10" text-anchor="end" fill="#333">One year / DSL</text><text x="208" y="141" font-size="9" text-anchor="start" fill="#444">$3.4k  churn 9.3%, n=570</text><rect x="194" y="152.5" width="10.2" height="17.0" fill="#1f6f8b"/><text x="188" y="165" font-size="10" text-anchor="end" fill="#333">Two year / Fiber optic</text><text x="208" y="165" font-size="9" text-anchor="start" fill="#444">$3.2k  churn 7.2%, n=429</text><rect x="194" y="176.7" width="6.3" height="17.0" fill="#1f6f8b"/><text x="188" y="189" font-size="10" text-anchor="end" fill="#333">Month-to-month / None</text><text x="204" y="189" font-size="9" text-anchor="start" fill="#444">$2.0k  churn 18.9%, n=524</text><rect x="194" y="201.0" width="2.5" height="17.0" fill="#1f6f8b"/><text x="188" y="213" font-size="10" text-anchor="end" fill="#333">Two year / DSL</text><text x="200" y="213" font-size="9" text-anchor="start" fill="#444">$0.8k  churn 1.9%, n=628</text><rect x="194" y="225.2" width="0.6" height="17.0" fill="#1f6f8b"/><text x="188" y="238" font-size="10" tex