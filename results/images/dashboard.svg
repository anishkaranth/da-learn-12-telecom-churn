<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="1266" viewBox="0 0 1328 1266" font-family="Helvetica,Arial,sans-serif"><rect width="1328" height="1266" fill="#fff"/><rect width="1328" height="1266" fill="#f6f7f9"/><text x="16" y="30" font-size="20" text-anchor="start" fill="#1f2d3d" font-weight="bold">Telco customer churn: who leaves, when, and how much revenue goes with them</text><text x="16" y="50" font-size="11" text-anchor="start" fill="#666">Rendered from results/tables (SQL on DuckDB). IBM Telco sample, 7,043 customers, one snapshot; churn = left within the last month; red bars = above the 26.5% average.</text><rect x="16" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="102" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">7,043</text><text x="102" y="108" font-size="10" text-anchor="middle" fill="#666">Customers</text><rect x="203" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="289" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">1,869</text><text x="289" y="108" font-size="10" text-anchor="middle" fill="#666">Churned</text><rect x="391" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="477" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">26.5%</text><text x="477" y="108" font-size="10" text-anchor="middle" fill="#666">Churn rate</text><rect x="578" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="664" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">$456k</text><text x="664" y="108" font-size="10" text-anchor="middle" fill="#666">MRR</text><rect x="766" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="851" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">$139.1k (30.5%)</text><text x="851" y="108" font-size="10" text-anchor="middle" fill="#666">MRR lost (at risk)</text><rect x="953" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="1039" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">$1.67M</text><text x="1039" y="108" font-size="10" text-anchor="middle" fill="#666">Annualised loss</text><rect x="1141" y="64" width="171" height="52" rx="6" fill="#fff" stroke="#dde"/><text x="1226" y="91" font-size="18" text-anchor="middle" fill="#1f6f8b" font-weight="bold">10 / 38 m</text><text x="1226" y="108" font-size="10" text-anchor="middle" fill="#666">Median tenure churned / kept</text><g transform="translate(16,128)"><rect width="640" height="360" rx="6" fill="#fff" stroke="#dde"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Churn rate by contract type (%)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">month-to-month = 55% of customers but 88.5% of churners and 86.9% of MRR lost</text><line x1="56" y1="314" x2="624" y2="314" stroke="#eee"/><text x="52" y="317" font-size="9" text-anchor="end" fill="#777">0</text><line x1="56" y1="250" x2="624" y2="250" stroke="#eee"/><text x="52" y="252" font-size="9" text-anchor="end" fill="#777">12.5</text><line x1="56" y1="185" x2="624" y2="185" stroke="#eee"/><text x="52" y="188" font-size="9" text-anchor="end" fill="#777">25</text><line x1="56" y1="120" x2="624" y2="120" stroke="#eee"/><text x="52" y="124" font-size="9" text-anchor="end" fill="#777">37.5</text><line x1="56" y1="56" x2="624" y2="56" stroke="#eee"/><text x="52" y="59" font-size="9" text-anchor="end" fill="#777">50</text><rect x="84.4" y="93.6" width="132.5" height="220.4" fill="#e07a5f"/><text x="151" y="90" font-size="9" text-anchor="middle" fill="#444">42.7%</text><text x="151" y="79" font-size="8" text-anchor="middle" fill="#888">n=3,875, $120.8k MRR lost</text><text x="151" y="328" font-size="9" text-anchor="middle" fill="#333">Month-to-month</text><rect x="273.7" y="255.8" width="132.5" height="58.2" fill="#1f6f8b"/><text x="340" y="252" font-size="9" text-anchor="middle" fill="#444">11.3%</text><text x="340" y="241" font-size="8" text-anchor="middle" fill="#888">n=1,473, $14.1k MRR lost</text><text x="340" y="328" font-size="9" text-anchor="middle" fill="#333">One year</text><rect x="463.1" y="299.4" width="132.5" height="14.6" fill="#1f6f8b"/><text x="529" y="295" font-size="9" text-anchor="middle" fill="#444">2.8%</text><text x="529" y="284" font-size="8" text-anchor="middle" fill="#888">n=1,695, $4.2k MRR lost</text><text x="529" y="328" font-size="9" text-anchor="middle" fill="#333">Two year</text><line x1="56" y1="314" x2="624" y2="314" stroke="#999"/><text x="14" y="185" font-size="10" text-anchor="middle" fill="#666" transform="rotate(-90 14 185)">churn rate %</text></g><g transform="translate(672,128)"><rect width="640" height="360" rx="6" fill="#fff" stroke="#dde"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Churn rate by tenure band (%)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">median tenure: churned 10 months vs retained 38; red = above the 26.5% average</text><line x1="56" y1="314" x2="624" y2="314" stroke="#eee"/><text x="52" y="317" font-size="9" text-anchor="end" fill="#777">0</text><line x1="56" y1="250" x2="624" y2="250" stroke="#eee"/><text x="52" y="252" font-size="9" text-anchor="end" fill="#777">15</text><line x1="56" y1="185" x2="624" y2="185" stroke="#eee"/><text x="52" y="188" font-size="9" text-anchor="end" fill="#777">30</text><line x1="56" y1="120" x2="624" y2="120" stroke="#eee"/><text x="52" y="124" font-size="9" text-anchor="end" fill="#777">45</text><line x1="56" y1="56" x2="624" y2="56" stroke="#eee"/><text x="52" y="59" font-size="9" text-anchor="end" fill="#777">60</text><rect x="68.2" y="86.4" width="56.8" height="227.6" fill="#e07a5f"/><text x="97" y="82" font-size="9" text-anchor="middle" fill="#444">52.9%</text><text x="97" y="71" font-size="8" text-anchor="middle" fill="#888">n=1,481</text><text x="97" y="328" font-size="9" text-anchor="middle" fill="#333">0-6 m</text><rect x="149.3" y="159.7" width="56.8" height="154.3" fill="#e07a5f"/><text x="178" y="156" font-size="9" text-anchor="middle" fill="#444">35.9%</text><text x="178" y="145" font-size="8" text-anchor="middle" fill="#888">n=705</text><text x="178" y="328" font-size="9" text-anchor="middle" fill="#333">7-12 m</text><rect x="230.5" y="190.5" width="56.8" height="123.5" fill="#e07a5f"/><text x="259" y="187" font-size="9" text-anchor="middle" fill="#444">28.7%</text><text x="259" y="176" font-size="8" text-anchor="middle" fill="#888">n=1,024</text><text x="259" y="328" font-size="9" text-anchor="middle" fill="#333">13-24 m</text><rect x="311.6" y="221.0" width="56.8" height="93.0" fill="#1f6f8b"/><text x="340" y="217" font-size="9" text-anchor="middle" fill="#444">21.6%</text><text x="340" y="206" font-size="8" text-anchor="middle" fill="#888">n=832</text><text x="340" y="328" font-size="9" text-anchor="middle" fill="#333">25-36 m</text><rect x="392.7" y="232.2" width="56.8" height="81.8" fill="#1f6f8b"/><text x="421" y="228" font-size="9" text-anchor="middle" fill="#444">19.0%</text><text x="421" y="217" font-size="8" text-anchor="middle" fill="#888">n=762</text><text x="421" y="328" font-size="9" text-anchor="middle" fill="#333">37-48 m</text><rect x="473.9" y="252.0" width="56.8" height="62.0" fill="#1f6f8b"/><text x="502" y="248" font-size="9" text-anchor="middle" fill="#444">14.4%</text><text x="502" y="237" font-size="8" text-anchor="middle" fill="#888">n=832</text><text x="502" y="328" font-size="9" text-anchor="middle" fill="#333">49-60 m</text><rect x="555.0" y="285.6" width="56.8" height="28.4" fill="#1f6f8b"/><text x="583" y="282" font-size="9" text-anchor="middle" fill="#444">6.6%</text><text x="583" y="271" font-size="8" text-anchor="middle" fill="#888">n=1,407</text><text x="583" y="328" font-size="9" text-anchor="middle" fill="#333">61-72 m</text><line x1="56" y1="314" x2="624" y2="314" stroke="#999"/><text x="14" y="185" font-size="10" text-anchor="middle" fill="#666" transform="rotate(-90 14 185)">churn rate %</text></g><g transform="translate(16,504)"><rect width="640" height="360" rx="6" fill="#fff" stroke="#dde"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Churn rate by internet service (%)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">fiber customers pay $91.50/month on average and carry 82.2% of MRR lost</text><line x1="56" y1="314" x2="624" y2="314" stroke="#eee"/><text x="52" y="317" font-size="9" text-anchor="end" fill="#777">0</text><line x1="56" y1="250" x2="624" y2="250" stroke="#eee"/><text x="52" y="252" font-size="9" text-anchor="end" fill="#777">12.5</text><line x1="56" y1="185" x2="624" y2="185" stroke="#eee"/><text x="52" y="188" font-size="9" text-anchor="end" fill="#777">25</text><line x1="56" y1="120" x2="624" y2="120" stroke="#eee"/><text x="52" y="124" font-size="9" text-anchor="end" fill="#777">37.5</text><line x1="56" y1="56" x2="624" y2="56" stroke="#eee"/><text x="52" y="59" font-size="9" text-anchor="end" fill="#777">50</text><rect x="84.4" y="97.8" width="132.5" height="216.2" fill="#e07a5f"/><text x="151" y="94" font-size="9" text-anchor="middle" fill="#444">41.9%</text><text x="151" y="83" font-size="8" text-anchor="middle" fill="#888">n=3,096, avg $92/mo</text><text x="151" y="328" font-size="9" text-anchor="middle" fill="#333">Fiber optic</text><rect x="273.7" y="216.2" width="132.5" height="97.8" fill="#1f6f8b"/><text x="340" y="212" font-size="9" text-anchor="middle" fill="#444">19.0%</text><text x="340" y="201" font-size="8" text-anchor="middle" fill="#888">n=2,421, avg $58/mo</text><text x="340" y="328" font-size="9" text-anchor="middle" fill="#333">DSL</text><rect x="463.1" y="275.8" width="132.5" height="38.2" fill="#1f6f8b"/><text x="529" y="272" font-size="9" text-anchor="middle" fill="#444">7.4%</text><text x="529" y="261" font-size="8" text-anchor="middle" fill="#888">n=1,526, avg $21/mo</text><text x="529" y="328" font-size="9" text-anchor="middle" fill="#333">None</text><line x1="56" y1="314" x2="624" y2="314" stroke="#999"/><text x="14" y="185" font-size="10" text-anchor="middle" fill="#666" transform="rotate(-90 14 185)">churn rate %</text></g><g transform="translate(672,504)"><rect width="640" height="220" rx="6" fill="#fff" stroke="#dde"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Churn rate by payment method (%)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">electronic check is the highest-churn method; automatic payment roughly halves churn</text><rect x="175" y="57.3" width="298.2" height="24.8" fill="#e07a5f"/><text x="169" y="74" font-size="10" text-anchor="end" fill="#333">Electronic check</text><text x="477" y="74" font-size="9" text-anchor="start" fill="#444">45.3%  n=2,365, $84.3k MRR lost</text><rect x="175" y="92.8" width="125.8" height="24.8" fill="#1f6f8b"/><text x="169" y="109" font-size="10" text-anchor="end" fill="#333">Mailed check</text><text x="305" y="109" font-size="9" text-anchor="start" fill="#444">19.1%  n=1,612, $16.8k MRR lost</text><rect x="175" y="128.3" width="110.0" height="24.8" fill="#1f6f8b"/><text x="169" y="145" font-size="10" text-anchor="end" fill="#333">Bank transfer (automatic)</text><text x="289" y="145" font-size="9" text-anchor="start" fill="#444">16.7%  n=1,544, $20.1k MRR lost</text><rect x="175" y="163.8" width="100.3" height="24.8" fill="#1f6f8b"/><text x="169" y="180" font-size="10" text-anchor="end" fill="#333">Credit card (automatic)</text><text x="279" y="180" font-size="9" text-anchor="start" fill="#444">15.2%  n=1,522, $17.9k MRR lost</text><line x1="175.0" y1="52" x2="175.0" y2="194" stroke="#999"/></g><g transform="translate(16,880)"><rect width="640" height="360" rx="6" fill="#fff" stroke="#dde"/><text x="12" y="22" font-size="14" text-anchor="st