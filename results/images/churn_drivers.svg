<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="Helvetica,Arial,sans-serif"><rect width="640" height="520" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Single-factor churn drivers: churn if true minus if false (pts)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">one factor at a time, not a model (factors overlap, e.g. fiber and month-to-month)</text><rect x="391.3" y="56.1" width="169.6" height="19.3" fill="#e07a5f"/><text x="157" y="70" font-size="10" text-anchor="end" fill="#333">Month-to-month contract</text><text x="565" y="70" font-size="9" text-anchor="start" fill="#444">+36.0</text><rect x="391.3" y="83.8" width="143.0" height="19.3" fill="#e07a5f"/><text x="157" y="97" font-size="10" text-anchor="end" fill="#333">Tenure &lt;= 12 months</text><text x="538" y="97" font-size="9" text-anchor="start" fill="#444">+30.3</text><rect x="391.3" y="111.4" width="133.2" height="19.3" fill="#e07a5f"/><text x="157" y="125" font-size="10" text-anchor="end" fill="#333">Electronic check</text><text x="528" y="125" font-size="9" text-anchor="start" fill="#444">+28.2</text><rect x="391.3" y="139.0" width="129.3" height="19.3" fill="#e07a5f"/><text x="157" y="153" font-size="10" text-anchor="end" fill="#333">Fiber optic internet</text><text x="525" y="153" font-size="9" text-anchor="start" fill="#444">+27.4</text><rect x="391.3" y="166.6" width="86.0" height="19.3" fill="#e07a5f"/><text x="157" y="180" font-size="10" text-anchor="end" fill="#333">Monthly charge &gt;= $70</text><text x="481" y="180" font-size="9" text-anchor="start" fill="#444">+18.2</text><rect x="391.3" y="194.3" width="85.3" height="19.3" fill="#e07a5f"/><text x="157" y="208" font-size="10" text-anchor="end" fill="#333">Senior citizen</text><text x="481" y="208" font-size="9" text-anchor="start" fill="#444">+18.1</text><rect x="391.3" y="221.9" width="81.3" height="19.3" fill="#e07a5f"/><text x="157" y="236" font-size="10" text-anchor="end" fill="#333">Paperless billing</text><text x="477" y="236" font-size="9" text-anchor="start" fill="#444">+17.2</text><rect x="391.3" y="249.5" width="27.1" height="19.3" fill="#e07a5f"/><text x="157" y="263" font-size="10" text-anchor="end" fill="#333">Streaming TV</text><text x="422" y="263" font-size="9" text-anchor="start" fill="#444">+5.7</text><rect x="387.7" y="277.1" width="3.6" height="19.3" fill="#1f6f8b"/><text x="157" y="291" font-size="10" text-anchor="end" fill="#333">Male</text><text x="384" y="291" font-size="9" text-anchor="end" fill="#444">-0.8</text><rect x="328.6" y="304.8" width="62.7" height="19.3" fill="#1f6f8b"/><text x="157" y="318" font-size="10" text-anchor="end" fill="#333">Has partner</text><text x="325" y="318" font-size="9" text-anchor="end" fill="#444">-13.3</text><rect x="316.6" y="332.4" width="74.7" height="19.3" fill="#1f6f8b"/><text x="157" y="346" font-size="10" text-anchor="end" fill="#333">Has dependents</text><text x="313" y="346" font-size="9" text-anchor="end" fill="#444">-15.8</text><rect x="315.7" y="360.0" width="75.6" height="19.3" fill="#1f6f8b"/><text x="157" y="374" font-size="10" text-anchor="end" fill="#333">Tech support</text><text x="312" y="374" font-size="9" text-anchor="end" fill="#444">-16.0</text><rect x="312.4" y="387.6" width="78.9" height="19.3" fill="#1f6f8b"/><text x="157" y="401" font-size="10" text-anchor="end" fill="#333">Online security</text><text x="308" y="401" font-size="9" text-anchor="end" fill="#444">-16.7</text><rect x="303.1" y="415.3" width="88.2" height="19.3" fill="#1f6f8b"/><text x="157" y="429" font-size="10" text-anchor="end" fill="#333">Automatic payment</text><text x="299" y="429" font-size="9" text-anchor="end" fill="#444">-18.7</text><rect x="276.1" y="442.9" width="115.2" height="19.3" fill="#1f6f8b"/><text x="157" y="457" font-size="10" text-anchor="end" fill="#333">No internet service</text><text x="272" y="457" font-size="9" text-anchor="end" fill="#444">-24.4</text><rect x="244.0" y="470.5" width="147.3" height="19.3" fill="#1f6f8b"/><text x="157" y="484" font-size="10" text-anchor="end" fill="#333">Two-year contract</text><text x="240" y="484" font-size="9" text-anchor="end" fill="#444">-31.2</text><line x1="391" y1="52" x2="391" y2="494" stroke="#999"/><text x="391" y="514" font-size="10" text-anchor="middle" fill="#666">percentage points (red = more churn, blue = less)</text></svg>
